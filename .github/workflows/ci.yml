name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Keep in sync with packageManager in package.json.
      - run: npm install --global --ignore-scripts npm@10.9.11
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run doctor
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Built from source and verified against the Go checksum database.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .'
